<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiros Passos no VSCode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-container">
        <h1>Meu Primeiro Feed</h1>
    </header>

    <main class="feed-container">
        
        <article class="post-card">
            <img src="https://picsum.photos/400/250" alt="Imagem de exemplo do post" class="post-img">
            
            <div class="post-content">
                <h2>Explorando o Front-end</h2>
                <p>Estou aprendendo HTML, CSS e JavaScript para criar páginas dinâmicas e responsivas.</p>
                
                <div class="like-section">
                    <button class="like-btn">❤️ Curtir</button>
                    <span class="like-count">0</span> curtidas
                </div>
            </div>
        </article>

        <article class="post-card">
            <img src="https://picsum.photos/400/251" alt="Segunda imagem de exemplo" class="post-img">
            
            <div class="post-content">
                <h2>Dominando o VS Code</h2>
                <p>Configurar o ambiente corretamente facilita muito o dia a dia do desenvolvedor.</p>
                
                <div class="like-section">
                    <button class="like-btn">❤️ Curtir</button>
                    <span class="like-count">0</span> curtidas
                </div>
            </div>
        </article>

    </main>

    <script src="script.js"></script>
</body>
</html>
