<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Fotos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Minha Galeria</h1>

<div class="galeria">

    <div class="card">
        <img src="imagens/paisagem.jpg" alt="Paisagem">

        <div class="conteudo">
            <h2>Paisagem</h2>
            <p>Uma bela vista da natureza.</p>

            <button class="curtir">❤️ Curtir</button>
            <p><span class="likes">0</span> curtidas</p>
        </div>
    </div>

    <div class="card">
        <img src="imagens/paisagem.jpg" alt="Praia">

        <div class="conteudo">
            <h2>Praia</h2>
            <p>Um ótimo lugar para descansar.</p>

            <button class="curtir">❤️ Curtir</button>
            <p><span class="likes">0</span> curtidas</p>
        </div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
